version: '3.9'

services:
  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${DB_NAME:-mydatabase}
      - POSTGRES_USER=${DB_USER:-myuser}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-mypassword}
    env_file:
      - ./.env

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  gunicorn:
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - ./config:/home/appuser/app/config
      - ./users:/home/appuser/app/users
      - ./chat:/home/appuser/app/chat
      - ./ai:/home/appuser/app/ai
      - ./schedule:/home/appuser/app/schedule
      - ./notifications:/home/appuser/app/notifications
      - ./manage.py:/home/appuser/app/manage.py
      - ./static:/home/appuser/app/static
      - ./media:/home/appuser/app/media
    expose:
      - "8000"
    depends_on:
      - db
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
    env_file:
      - ./.env

  daphne:
    build: .
    command: daphne -b 0.0.0.0 -p 8001 config.asgi:application
    volumes:
      - ./config:/home/appuser/app/config
      - ./users:/home/appuser/app/users
      - ./chat:/home/appuser/app/chat
      - ./ai:/home/appuser/app/ai
      - ./schedule:/home/appuser/app/schedule
      - ./notifications:/home/appuser/app/notifications
      - ./manage.py:/home/appuser/app/manage.py
    expose:
      - "8001"
    depends_on:
      - db
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
    env_file:
      - ./.env

  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./static:/home/appuser/app/static
      - ./media:/home/appuser/app/media
    depends_on:
      - gunicorn
      - daphne

  worker:
    build: .
    command: /home/appuser/.venv/bin/celery -A config worker -l info
    volumes:
      - ./config:/home/appuser/app/config
      - ./users:/home/appuser/app/users
      - ./chat:/home/appuser/app/chat
      - ./ai:/home/appuser/app/ai
      - ./schedule:/home/appuser/app/schedule
      - ./notifications:/home/appuser/app/notifications
      - ./manage.py:/home/appuser/app/manage.py
    depends_on:
      - db
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
    env_file:
      - ./.env

volumes:
  postgres_data:

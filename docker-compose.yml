services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - staticfiles_volume:/var/www/staticfiles
    depends_on:
      web:
          condition: service_healthy # <--- web 서비스가 healthy 상태일 때만 시작

  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${DB_NAME:-mydatabase}
      - POSTGRES_USER=${DB_USER:-myuser}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-mypassword}
    env_file:
      - ./.env

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    volumes:
      - ./config:/app/config
      - ./users:/app/users
      - ./chat:/app/chat
      - ./ai:/app/ai
      - ./schedule:/app/schedule
      - ./notifications:/app/notifications
      - ./search:/app/search
      - ./manage.py:/app/manage.py
      - staticfiles_volume:/app/staticfiles
    depends_on:
      - db
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s = socket.create_connection((\"localhost\", 8000), timeout=1); s.close()' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s # 20초 동안은 실패해도 재시도만 함 (초기 구동 시간 확보)


  worker:
    build: .
    command:  /usr/local/bin/celery -A config worker -l info
    volumes:
      - ./config:/app/config
      - ./users:/app/users
      - ./chat:/app/chat
      - ./ai:/app/ai
      - ./schedule:/app/schedule
      - ./notifications:/app/notifications
      - ./manage.py:/app/manage.py
    depends_on:
      - db
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
    env_file:
      - ./.env

volumes:
  postgres_data:
  staticfiles_volume:
services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - staticfiles_volume:/var/www/staticfiles
    depends_on:
      - web

  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${DB_NAME:-mydatabase}
      - POSTGRES_USER=${DB_USER:-myuser}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-mypassword}
    env_file:
      - ./.env

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    command: sh -c "sleep 10 && daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    volumes:
      - ./config:/app/config
      - ./users:/app/users
      - ./chat:/app/chat
      - ./ai:/app/ai
      - ./schedule:/app/schedule
      - ./notifications:/app/notifications
      - ./search:/app/search
      - ./manage.py:/app/manage.py
      - staticfiles_volume:/app/staticfiles
    depends_on:
      - db
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
    env_file:
      - ./.env

  worker:
    build: .
    command:  /usr/local/bin/celery -A config worker -l info
    volumes:
      - ./config:/app/config
      - ./users:/app/users
      - ./chat:/app/chat
      - ./ai:/app/ai
      - ./schedule:/app/schedule
      - ./notifications:/app/notifications
      - ./manage.py:/app/manage.py
    depends_on:
      - db
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
    env_file:
      - ./.env

volumes:
  postgres_data:
  staticfiles_volume:
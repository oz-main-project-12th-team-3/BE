services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - staticfiles_volume:/var/www/staticfiles
    # web 서비스가 완전히 준비(healthy)될 때까지 NGINX 시작 대기
    depends_on:
      web:
          condition: service_healthy

  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${DB_NAME:-mydatabase}
      - POSTGRES_USER=${DB_USER:-myuser}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-mypassword}
    env_file:
      - ./.env
    # DB가 연결을 받을 준비가 되었는지 확인하는 healthcheck 추가
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    # start.sh 스크립트 실행 명령으로 변경
    command: /usr/local/bin/start.sh
    volumes:
      - ./utils:/app/utils
      - ./config:/app/config
      - ./users:/app/users
      - ./chat:/app/chat
      - ./ai:/app/ai
      - ./schedule:/app/schedule
      - ./notifications:/app/notifications
      - ./search:/app/search
      - ./manage.py:/app/manage.py
      - staticfiles_volume:/app/staticfiles

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - PYTHONPATH=/app
    env_file:
      - ./.env

    # web 애플리케이션이 포트 8000에 응답하는지 확인
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s = socket.create_connection((\"localhost\", 8000), timeout=1); s.close()' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s

  worker:
    build: .
    command:  /usr/local/bin/celery -A config worker -l info
    volumes:
      - ./utils:/app/utils
      - ./config:/app/config
      - ./users:/app/users
      - ./chat:/app/chat
      - ./ai:/app/ai
      - ./schedule:/app/schedule
      - ./notifications:/app/notifications
      - ./search:/app/search
      - ./manage.py:/app/manage.py

    # DB가 HEALTHY할 때까지 worker 시작 대기
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - PYTHONPATH=/app
    env_file:
      - ./.env

volumes:
  postgres_data:
  staticfiles_volume:
upstream django_server {
    server web:8000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # Serve static files directly
    location /static/ {
        alias /var/app/current/staticfiles/;
        expires 30d; # Cache static files
        add_header Cache-Control "public, no-transform";
    }

    # Proxy API requests to the Django backend
    location /api/ {
        proxy_pass http://django_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;

        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        # Add CORS headers for API endpoints
        add_header 'Access-Control-Allow-Origin' 'https://ozaisecretary.com' always; # Specific frontend domain
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Max-Age' 1728000 always;
            add_header 'Content-Type' 'text/plain charset=utf-8' always;
            add_header 'Content-Length' 0 always;
            return 204;
        }
    }

    # Serve frontend index.html for all other requests (SPA routing)
    location / {
        root /app/frontend/dist; # Confirmed frontend build output path
        index index.html;
        try_files $uri $uri/ /index.html; # Important for SPA routing
    }
}

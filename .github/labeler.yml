# PR 자동 라벨링
'🎯 backend':
  # 'paths:' 키워드 제거
  - 'ai/**/*'
  - 'chat/**/*'
  - 'users/**/*'
  - 'config/**/*'
  - '**/*.py'
  - '**/models/**/*'
  - '**/views/**/*'
  - '**/serializers/**/*'

'📝 documentation':
  # 'paths:' 키워드 제거
  - '**/*.md'
  - 'docs/**/*'
  - 'README*'

'🔧 configuration':
  # 'paths:' 키워드 제거
  - '.github/**/*'
  - '**/*.json'
  - '**/*.yml'
  - '**/*.yaml'
  - 'Dockerfile'
  - 'docker-compose.*'
  - 'pyproject.toml'
  - 'pytest.ini'
  - 'requirements.txt'

'🧪 tests':
  # 'paths:' 키워드 제거
  - '**/*.test.*'
  - '**/tests/**/*'

'🚀 deployment':
  # 'paths:' 키워드 제거
  - 'k8s/**/*'
  - 'deployment/**/*'
  - '.github/workflows/deploy*'
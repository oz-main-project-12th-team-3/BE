name: Code Quality Check

on:
  push:
    branches: [ "main", "develop", "feature", "feature/**" ]
  pull_request:
    branches: [ "main", "develop", "feature", "feature/**" ]
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use'
        required: false
        default: '3.10'
        type: string
      skip-tests:
        description: 'Skip running tests'
        required: false
        default: false
        type: boolean
    secrets:
      SLACK_WEBHOOK_URL:
        required: false
      DISCORD_WEBHOOK:
        required: false

jobs:
  code-quality:
    runs-on: ubuntu-latest
    name: 🔎 Code Quality Check
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13"]

    steps:
    - name: 📂 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🐍 Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: 📥 Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential

    - name: 📥 Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install wheel setuptools
        
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi
        
        if [ -f requirements-dev.txt ]; then
          pip install -r requirements-dev.txt
        elif [ -f dev-requirements.txt ]; then
          pip install -r dev-requirements.txt
        else
          pip install pytest pytest-django pytest-cov pytest-xvfb
          pip install ruff black isort mypy
          pip install pip-audit safety
        fi

    # 추가: two_factor 패치 스크립트 실행 단계
    - name: 🔧 Patch two_factor urls.py
      run: |
        python3 - <<EOF
        import re
        import sys
        import sysconfig
        from pathlib import Path
        
        site_packages_dir = Path(sysconfig.get_paths()["purelib"])
        file_path = site_packages_dir / 'two_factor' / 'urls.py'
        
        print(f"Looking for two_factor urls.py at: {file_path}")
        
        if not file_path.exists():
            print(f"Warning: {file_path} not found, skipping patch", file=sys.stderr)
            sys.exit(0)
        
        with open(file_path, "r") as f:
            content = f.read()
        
        pattern = r"(urlpatterns\s*=\s*\((.+?)),\s*['\"]two_factor['\"]\s*\)"
        
        def replace_tuple(match):
            return match.group(1) + ')'
        
        content = re.sub(pattern, replace_tuple, content, flags=re.DOTALL)
        
        if 'app_name = "two_factor"' not in content:
            content = 'app_name = "two_factor"\\n' + content
        
        with open(file_path, "w") as f:
            f.write(content)
        
        print(f"Successfully patched {file_path}")
        EOF

    - name: 📊 Cache test results
      uses: actions/cache@v4
      with:
        path: |
          .pytest_cache
          .ruff_cache
          .mypy_cache
        key: ${{ runner.os }}-test-cache-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-test-cache-${{ matrix.python-version }}-
          ${{ runner.os }}-test-cache-

    - name: 🧹 Code formatting check
      id: code-formatting-check
      run: |
        echo "🔍 Checking code formatting with ruff..."
        ruff format --check --diff .

    - name: 🧽 Lint with ruff
      id: lint-with-ruff
      run: |
        echo "🔍 Running ruff linter..."
        ruff check . --output-format=github
        ruff check . --statistics || true

    - name: 📏 Import sorting check
      id: import-sorting-check
      run: |
        echo "🔍 Checking import sorting..."
        ruff check --select I .

    - name: 🔍 Type checking
      id: type-checking
      continue-on-error: true
      run: |
        if command -v mypy &> /dev/null; then
          echo "🔍 Running type checking with mypy..."
          mypy . --ignore-missing-imports --show-error-codes || true
        else
          echo "⚠️ mypy not installed, skipping type checking"
        fi

    - name: 🧪 Run Migrations
      id: run-migrations
      if: ${{ !inputs.skip-tests }}
      run: |
        echo "⚙️ Running database migrations..."
        python manage.py migrate
      env:
        RUNNING_TESTS: 1
        PYTHONPATH: ${{ github.workspace }}

    - name: 🧪 Run Tests with Coverage
      id: run-tests-with-coverage
      if: ${{ !inputs.skip-tests }}
      run: |
        echo "🧪 Running tests with coverage..."
        
        if python -c "import django" 2>/dev/null; then
          echo "📱 Detected Django project"
          export DJANGO_SETTINGS_MODULE=config.settings
          pytest --cov=. --cov-report=xml --cov-report=html --cov-report=term-missing -v
        else
          echo "🐍 Running standard Python tests"
          pytest --cov=. --cov-report=xml --cov-report=html --cov-report=term-missing -v
        fi
      env:
        RUNNING_TESTS: 1
        PYTHONPATH: ${{ github.workspace }}

    - name: 📊 Upload coverage to Codecov
      if: ${{ !inputs.skip-tests }}
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: 🔒 Security audit with pip-audit
      id: security-audit-with-pip-audit
      continue-on-error: true
      run: |
        echo "🔒 Running security audit..."
        pip-audit --format=json --output=audit-results.json || true
        pip-audit --format=columns || true

    - name: 🔒 Security scan with safety
      id: security-scan-with-safety
      continue-on-error: true
      run: |
        if command -v safety &> /dev/null; then
          echo "🔒 Running safety security scan..."
          safety check --json || true
        else
          echo "⚠️ safety not installed, installing and running..."
          pip install safety
          safety check || true
        fi

    - name: ☁️ SonarCloud Analysis
      uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
      if: github.event_name == 'pull_request' || github.event_name == 'push'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: https://sonarcloud.io
      with:
        projectBaseDir: .
        args: >
          -Dsonar.projectKey=oz-main-project-12th-team-3_BE
          -Dsonar.organization=oz-main-project-12th-team-3
          -Dsonar.python.version=${{ matrix.python-version }}
          -Dsonar.python.coverage.reportPaths=coverage.xml

    - name: 📈 Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.python-version }}
        path: |
          htmlcov/
          coverage.xml
          audit-results.json
          .pytest_cache/
        retention-days: 30

    - name: 💬 Comment PR with results
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          
          let comment = '## 🔎 Code Quality Report\n\n';
          const jobStatus = '${{ job.status }}';
          const statusEmoji = jobStatus === 'success' ? '✅' : jobStatus === 'failure' ? '❌' : '⚠️';
          comment += `${statusEmoji} **Overall Status:** ${jobStatus}\n\n`;
          comment += `🐍 **Python Version:** ${{ matrix.python-version }}\n\n`;
          comment += '### Steps Summary:\n';
          comment += `- 🧹 Code formatting: ${{ steps.code-formatting-check.outcome || 'skipped' }}\n`;
          comment += `- 🧽 Linting: ${{ steps.lint-with-ruff.outcome || 'skipped' }}\n`;
          comment += `- 📏 Import sorting: ${{ steps.import-sorting-check.outcome || 'skipped' }}\n`;
          comment += `- 🔍 Type checking: ${{ steps.type-checking.outcome || 'skipped' }}\n`;
          comment += `- 🧪 Tests: ${{ steps.run-tests-with-coverage.outcome || 'skipped' }}\n`;
          comment += `- 🔒 Security audit: ${{ steps.security-audit-with-pip-audit.outcome || 'skipped' }}\n\n`;
          
          const comments = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });

          const botComment = comments.data.find(comment => 
            comment.user.type === 'Bot' && comment.body.includes('🔎 Code Quality Report')
          );

          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: comment
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
          }

  notify:
    needs: code-quality
    if: always()
    runs-on: ubuntu-latest

    steps:
    - name: 📢 Slack notification
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      if: env.SLACK_WEBHOOK_URL != ''
      uses: 8398a7/action-slack@v3
      with:
        status: custom
        custom_payload: |
          {
            "text": "Code Quality Check Results",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "${{ needs.code-quality.result == 'success' && '✅' || '❌' }} *Code Quality Check* ${{ needs.code-quality.result }}\n*Repository:* ${{ github.repository }}\n*Branch:* ${{ github.ref_name }}\n*Commit:* ${{ github.sha }}\n*Actor:* ${{ github.actor }}"
                }
              }
            ]
          }

    - name: 💬 Discord notification
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      if: env.DISCORD_WEBHOOK != ''
      uses: Ilshidur/action-discord@master
      with:
        args: |
          ${{ needs.code-quality.result == 'success' && '✅' || '❌' }} **Code Quality Check ${{ needs.code-quality.result }}**
          **Repository:** ${{ github.repository }}
          **Branch:** ${{ github.ref_name }}
          **Commit:** ${{ github.sha }}
          **Actor:** ${{ github.actor }}
